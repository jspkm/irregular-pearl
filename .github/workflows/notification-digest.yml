name: Daily Notification Digest

# Scheduling note: see weekly-digest.yml. The cron that used to live here is
# now a pg_cron job inside Supabase, which has no repo-activity dependency.
# This workflow remains as a manual, preview-capable smoke test.

on:
  workflow_dispatch:
    inputs:
      preview_to:
        description: 'Send only to this address (safe smoke test). Leave blank to send to ALL subscribers.'
        required: false
        type: string
        default: ''

jobs:
  send:
    uses: ./.github/workflows/digest-send.yml
    with:
      function: send-notification-digest
      label: Notification digest
      preview_to: ${{ inputs.preview_to }}
    secrets: inherit
