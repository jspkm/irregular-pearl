name: Weekly Digest Email

# Scheduling note: this used to carry a `schedule:` cron trigger. GitHub
# disables schedule triggers after ~60 days of repository inactivity, which
# silently killed this workflow between 2026-07-12 and 2026-09-07 — nine
# weekly digests never sent, with no error anywhere. The schedule now lives in
# a pg_cron job inside Supabase, which has no repo-activity dependency. This
# file remains as a manual, preview-capable smoke test.

on:
  workflow_dispatch:
    inputs:
      preview_to:
        description: 'Send only to this address (safe smoke test). Leave blank to send to ALL subscribers.'
        required: false
        type: string
        default: ''

jobs:
  send:
    uses: ./.github/workflows/digest-send.yml
    with:
      function: send-weekly-digest
      label: Weekly digest
      preview_to: ${{ inputs.preview_to }}
    secrets: inherit
