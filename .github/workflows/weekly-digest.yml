name: Weekly Digest Email

on:
  schedule:
    # Offset from the daily notification-digest (0 13 * * *) so users opted
    # in to both prefs on a Sunday don't get two concurrent emails.
    - cron: '30 13 * * 0' # Every Sunday at 13:30 UTC = 09:30 ET (EDT; 08:30 during EST)
  workflow_dispatch: # Manual trigger

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger weekly digest edge function
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/send-weekly-digest" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Response ($HTTP_CODE): $BODY"

          if echo "$BODY" | grep -q "UNSUBSCRIBE_SECRET not set"; then
            echo "::error::UNSUBSCRIBE_SECRET is not configured on the Supabase project. Set it with: bunx supabase secrets set UNSUBSCRIBE_SECRET=\$(openssl rand -hex 32). The same value must also live in Cloudflare Pages env."
            exit 1
          fi

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Weekly digest failed with HTTP $HTTP_CODE"
            exit 1
          fi
