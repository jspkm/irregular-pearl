name: CI

# Runs the three gates that were previously unenforced: unit tests, Astro's
# typecheck, and a production build. Every one of them was broken or red at
# some point before this workflow existed — `astro check` could not run at all,
# the test suite was order-dependent, and database.types.ts had drifted two
# migrations behind. Nothing caught any of it, because nothing ran.
#
# Deliberately does NOT run src/integration or src/e2e: those need a live
# Supabase stack. `bun run test` covers src/lib, src/data, src/components and
# src/tests, none of which require a reachable server — they only need the
# PUBLIC_SUPABASE_* vars to be set, since components like UsernameEditor
# render null when `hasSupabase` is false.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # Supersede in-flight runs for the same ref; a stale result gates nothing.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version used locally. Bump both together.
          bun-version: 1.3.11

      - name: Install dependencies
        # --frozen-lockfile fails if bun.lock and package.json disagree, which
        # is its own useful signal: it catches a dependency added with npm
        # (which writes package.json but not bun.lock).
        run: bun install --frozen-lockfile

      - name: Load test env
        # .env.test holds the standard local-Supabase development keys — the
        # same values shipped with every Supabase CLI install, not secrets.
        # Sourced here rather than duplicated into this file so there is one
        # place to change them. The grep skips comments and blank lines.
        run: grep -E '^[A-Z_][A-Z0-9_]*=' .env.test >> "$GITHUB_ENV"

      - name: Unit tests
        run: bun run test

      - name: Typecheck
        run: bun run check

      - name: Build
        run: bun run build
