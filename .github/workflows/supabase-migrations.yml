name: Supabase Migrations

# Applies new migrations to the linked Supabase project after CI passes on
# main. Idempotent — existing migrations are skipped via the schema_migrations
# table the CLI maintains.
#
# Gated on the CI workflow rather than firing on the push itself: this job
# applies irreversible schema changes to the production database, so it should
# be the most-verified step in the pipeline, not the least. Previously it ran
# with no test, typecheck or build gate at all.
#
# workflow_run cannot carry the old `paths:` filter, so this now runs after
# every green CI on main. That is safe and cheap — `supabase db push` is a
# no-op when there are no unapplied migrations.
#
# Manual trigger available via workflow_dispatch when a one-off push is needed
# (e.g. replaying after a rollback, or catching up after disabling this
# workflow).
#
# Required repo secrets (two new; project ref derived from existing SUPABASE_URL):
#   SUPABASE_ACCESS_TOKEN   Personal access token (starts with `sbp_`), create
#                           at https://supabase.com/dashboard/account/tokens.
#                           Different from SUPABASE_SERVICE_ROLE_KEY — this
#                           auths the CLI against the Supabase management API,
#                           not the project runtime.
#   SUPABASE_DB_PASSWORD    Postgres password for the linked project. From
#                           Dashboard → Project Settings → Database.
# Reused from existing workflows:
#   SUPABASE_URL            `https://<ref>.supabase.co`. Project ref is
#                           extracted from the subdomain.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Only one migration run at a time; queue the rest.
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # workflow_run fires on failure too, so a red CI must not reach the
    # database. A manual dispatch is an explicit human override and is allowed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_run defaults to the default branch tip; pin to the exact
          # commit CI validated so the migrations applied are the ones tested.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Derive project ref from SUPABASE_URL
        id: ref
        run: |
          URL="${{ secrets.SUPABASE_URL }}"
          # Expect https://<ref>.supabase.co → strip scheme + domain suffix.
          REF=$(echo "$URL" | sed -E 's|https?://||; s|\.supabase\.co.*||')
          if [ -z "$REF" ]; then
            echo "::error::Could not derive project ref from SUPABASE_URL ($URL)"
            exit 1
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          # Don't print the full ref in logs — mask it.
          echo "::add-mask::$REF"

      - name: Link to project
        run: supabase link --project-ref "${{ steps.ref.outputs.ref }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        # `supabase db push` applies only migrations not already recorded in
        # the project's schema_migrations table. Idempotent; safe on re-runs.
        # `--include-all` covers the case where a feature branch's migration
        # has a timestamp older than what's already on prod (timestamp
        # inversion). Without it, the CLI fails closed and blocks every later
        # migration too. The gate for reaching this step is a green CI run on
        # the merged commit (see the `if:` above), not review alone.
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Summary
        if: always()
        run: |
          echo "## Migration push summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${GITHUB_SHA::8}\`" >> $GITHUB_STEP_SUMMARY
          echo "Result: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
